<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTNHS Smart Quiz System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='quiz_record.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='sweetalert2.min.css') }}">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="header">GENERAL TINIO NATIONAL HIGH SCHOOL SMART QUIZ SYSTEM</div>

    <div class="sidebar">
        <div class="logo-section">
            <div class="logo">QZ</div>
            <div class="logo-text">SMART QUIZ</div>
        </div>

        <form action="/menu_action" method="POST">
            <button type="submit" name="menu" value="dashboard" class="menu-item">DASHBOARD</button>
            <button type="submit" name="menu" value="create_quiz" class="menu-item">CREATE QUIZ</button>
            <button type="submit" name="menu" value="session" class="menu-item">SESSION</button>
            <!--<button type="submit" name="menu" value="quiz_record" class="menu-item">QUIZ RECORD</button>-->
            <button type="submit" name="menu" value="retrieval" class="menu-item">RETRIEVAL</button>
        </form>

        <button class="menu-item" id="logoutButton">Logout</button>
    </div>

    <main class="main-content">
        <div class="content-box">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-box" placeholder="Search" id="searchBox">
            </div>

            <h2>Records</h2>

            <div id="recordsContainer">
                <!-- Records will be loaded here dynamically -->
            </div>
        </div>
    </main>

    <!-- View Details Modal -->
    <div id="viewModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: white; border-radius: 15px; padding: 30px; max-width: 800px; max-height: 80vh; overflow-y: auto; width: 90%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="modalTitle" style="color: #2c3e50; margin: 0;">Quiz Details</h2>
                <button onclick="closeViewModal()" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">Close</button>
            </div>
            <div id="modalContent">
                <!-- Details will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        let allRecords = [];

// Load records from database
window.onload = function() {
    loadRecords();
    
    // Setup logout
    document.getElementById('logoutButton').addEventListener('click', function(e) {
        e.preventDefault();
        logout();
    });

    // Setup search
    document.getElementById('searchBox').addEventListener('input', function() {
        filterRecords(this.value);
    });
};

// Load quiz records from API
function loadRecords() {
    const container = document.getElementById('recordsContainer'); // Make sure this matches your HTML
    container.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Loading quiz records...
        </div>
    `;

    fetch('/api/get_quiz_records')
        .then(response => response.json())
        .then(data => {
            console.log('Quiz records response:', data);
            if (data.success) {
                allRecords = data.records || [];
                displayRecords(allRecords);
            } else {
                console.error('Failed to load quiz records:', data.message);
                Swal.fire('Error', data.message || 'Failed to load records', 'error');
                displayRecords([]);
            }
        })
        .catch(error => {
            console.error('Error loading records:', error);
            Swal.fire('Error', 'Failed to connect to server', 'error');
            displayRecords([]);
        });
}

// Display quiz records
function displayRecords(records) {
    const container = document.getElementById('recordsContainer'); // Make sure this matches your HTML
    
    if (!records || records.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <div class="empty-state-text">No quiz records found</div>
                <p style="color: #7a8a99; margin-top: 10px;">Archived quizzes will appear here</p>
            </div>
        `;
        return;
    }

    container.innerHTML = records.map(quiz => `
        <div class="record-item" data-quiz-id="${quiz.quiz_id}">
            <div class="record-info">
                <div class="quiz-title">${escapeHtml(quiz.topic || 'Untitled Quiz')}</div>
                <div class="quiz-details">
                    <div class="detail-item">
                        <span class="detail-icon">📚</span>
                        <span>${escapeHtml(quiz.subject || 'N/A')}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">👥</span>
                        <span>${escapeHtml(quiz.section_name || 'N/A')}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">🎓</span>
                        <span>Grade ${escapeHtml(quiz.grade_level || 'N/A')}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">📅</span>
                        <span>Created: ${escapeHtml(quiz.date_created || 'N/A')}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">👨‍🎓</span>
                        <span>${quiz.student_count || 0} students</span>
                    </div>
                </div>
            </div>
            <div class="button-group">
                <button class="btn btn-view" onclick="viewRecord(${quiz.quiz_id})">
                    📊 View Results
                </button>
                <button class="btn btn-retrieve" onclick="moveRecordToRetrieval(${quiz.quiz_id})">
                    🗑️ Move to Retrieval
                </button>
            </div>
        </div>
    `).join('');
}

// Helper function to escape HTML
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Filter records by search term
function filterRecords(searchTerm) {
    if (!allRecords || allRecords.length === 0) {
        return;
    }
    
    const filtered = allRecords.filter(record => {
        const searchString = `${record.section_name || ''} ${record.subject || ''} ${record.topic || ''}`.toLowerCase();
        return searchString.includes(searchTerm.toLowerCase());
    });
    displayRecords(filtered);
}

// Move quiz record to retrieval section
function moveRecordToRetrieval(quizId) {
    Swal.fire({
        title: 'Move to Retrieval?',
        text: 'This quiz record will be moved to retrieval section. You can restore it later.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#e53e3e',
        cancelButtonColor: '#999',
        confirmButtonText: 'Yes, Move to Retrieval',
        cancelButtonText: 'Cancel'
    }).then((result) => {
        if (result.isConfirmed) {
            fetch(`/api/delete_quiz/${quizId}`, {  // ← Fixed syntax (was using backticks wrong)
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    Swal.fire({
                        title: 'Moved to Retrieval!',
                        text: 'Quiz record has been moved to retrieval section',
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    });
                    loadRecords(); // Reload quiz records
                } else {
                    Swal.fire('Error', data.message || 'Failed to move quiz record', 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                Swal.fire('Error', 'Failed to move quiz record', 'error');
            });
        }
    });
}

// View detailed quiz record
function viewRecord(quizId) {
    fetch(`/api/get_quiz_record_detail/${quizId}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showViewModal(data);
            } else {
                Swal.fire('Error', data.message || 'Failed to load details', 'error');
            }
        })
        .catch(error => {
            console.error('Error loading record details:', error);
            Swal.fire('Error', 'Failed to load record details', 'error');
        });
}

// Show detailed view modal
function showViewModal(data) {
    const modal = document.getElementById('viewModal');
    const modalContent = document.getElementById('modalContent');
    const modalTitle = document.getElementById('modalTitle');

    modalTitle.textContent = `${data.quiz.section_name} - ${data.quiz.subject}`;

    let html = `
        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
            <h3 style="color: #2c3e50; margin-bottom: 15px;">Quiz Information</h3>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
                <div>
                    <strong>Section:</strong> ${data.quiz.section_name}
                </div>
                <div>
                    <strong>Subject:</strong> ${data.quiz.subject}
                </div>
                <div>
                    <strong>Topic:</strong> ${data.quiz.topic}
                </div>
                <div>
                    <strong>Grade Level:</strong> ${data.quiz.grade_level}
                </div>
                <div>
                    <strong>Date Created:</strong> ${data.quiz.date_created}
                </div>
                <div>
                    <strong>Duration:</strong> ${Math.floor(data.quiz.duration / 60)} minutes
                </div>
                <div>
                    <strong>Status:</strong> ${data.quiz.status.toUpperCase()}
                </div>
                <div>
                    <strong>Total Students:</strong> ${data.students.length}
                </div>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <h3 style="color: #2c3e50; margin-bottom: 15px;">Questions Summary</h3>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                <div style="background: #e8f4f8; padding: 15px; border-radius: 10px; text-align: center;">
                    <div style="font-size: 24px; font-weight: bold; color: #3498db;">${data.questions.beginner.length}</div>
                    <div style="color: #7a8a99;">Beginner</div>
                </div>
                <div style="background: #fff4e6; padding: 15px; border-radius: 10px; text-align: center;">
                    <div style="font-size: 24px; font-weight: bold; color: #f39c12;">${data.questions.intermediate.length}</div>
                    <div style="color: #7a8a99;">Intermediate</div>
                </div>
                <div style="background: #ffe6e6; padding: 15px; border-radius: 10px; text-align: center;">
                    <div style="font-size: 24px; font-weight: bold; color: #e74c3c;">${data.questions.advanced.length}</div>
                    <div style="color: #7a8a99;">Advanced</div>
                </div>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <h3 style="color: #2c3e50; margin-bottom: 15px;">Student Results</h3>
    `;

    if (data.students.length === 0) {
        html += '<p style="text-align: center; color: #7a8a99; padding: 20px;">No students have taken this quiz yet</p>';
    } else {
        html += `
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background: #4a5a6b; color: white;">
                        <th style="padding: 12px; text-align: left;">Student ID</th>
                        <th style="padding: 12px; text-align: left;">Name</th>
                        <th style="padding: 12px; text-align: center;">Score</th>
                        <th style="padding: 12px; text-align: center;">Status</th>
                        <th style="padding: 12px; text-align: center;">Time Taken</th>
                    </tr>
                </thead>
                <tbody>
        `;

        data.students.forEach(student => {
            const statusColor = student.status === 'completed' ? '#27ae60' : 
                               student.status === 'in-progress' ? '#f39c12' : '#95a5a6';
            html += `
                <tr style="border-bottom: 1px solid #e8eef3;">
                    <td style="padding: 12px;">${student.student_id}</td>
                    <td style="padding: 12px;">${student.first_name} ${student.last_name}</td>
                    <td style="padding: 12px; text-align: center; font-weight: bold; color: #2c3e50;">${student.score || 0}%</td>
                    <td style="padding: 12px; text-align: center;">
                        <span style="background: ${statusColor}; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold;">
                            ${student.status.toUpperCase()}
                        </span>
                    </td>
                    <td style="padding: 12px; text-align: center;">${student.time_taken || 'N/A'}</td>
                </tr>
            `;
        });

        html += `
                </tbody>
            </table>
        `;
    }

    html += `
        </div>

        <div style="margin-top: 20px;">
            <h3 style="color: #2c3e50; margin-bottom: 15px;">Statistics</h3>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
                <div style="background: #e8f4f8; padding: 15px; border-radius: 10px; text-align: center;">
                    <div style="font-size: 20px; font-weight: bold; color: #3498db;">${data.stats.completed}</div>
                    <div style="color: #7a8a99; font-size: 12px;">Completed</div>
                </div>
                <div style="background: #fff4e6; padding: 15px; border-radius: 10px; text-align: center;">
                    <div style="font-size: 20px; font-weight: bold; color: #f39c12;">${data.stats.in_progress}</div>
                    <div style="color: #7a8a99; font-size: 12px;">In Progress</div>
                </div>
                <div style="background: #f0f0f0; padding: 15px; border-radius: 10px; text-align: center;">
                    <div style="font-size: 20px; font-weight: bold; color: #95a5a6;">${data.stats.not_started}</div>
                    <div style="color: #7a8a99; font-size: 12px;">Not Started</div>
                </div>
                <div style="background: #e8f8f5; padding: 15px; border-radius: 10px; text-align: center;">
                    <div style="font-size: 20px; font-weight: bold; color: #27ae60;">${data.stats.average_score}%</div>
                    <div style="color: #7a8a99; font-size: 12px;">Avg Score</div>
                </div>
            </div>
        </div>
    `;

    modalContent.innerHTML = html;
    modal.style.display = 'flex';
}

// Close view modal
function closeViewModal() {
    document.getElementById('viewModal').style.display = 'none';
}

// Logout function
function logout() {
    Swal.fire({
        title: "Confirm Logout",
        text: "Are you sure you want to logout?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#d33",
        cancelButtonColor: "#3085d6",
        confirmButtonText: "Logout",
        cancelButtonText: "Cancel",
        reverseButtons: true
    }).then((result) => {
        if (result.isConfirmed) {
            Swal.fire({
                title: "Logged Out",
                text: "You have been logged out successfully.",
                icon: "success",
                timer: 1200,
                showConfirmButton: false
            });
            setTimeout(() => {
                window.location.href = "/process_logout";
            }, 1200);
        }
    });
}
    </script>
</body>
</html>
